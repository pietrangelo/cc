name: Test

on: [push, pull_request]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # The sec release that `cc init` pins by default.
      SEC_REF: v2.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build sec
        run: |
          git clone --depth 1 --branch "$SEC_REF" https://github.com/pietrangelo/sec "$RUNNER_TEMP/sec"
          (cd "$RUNNER_TEMP/sec" && go build -o "$RUNNER_TEMP/sec-bin" .)
      - name: ShellCheck
        run: shellcheck cc tests/e2e.sh
      - name: End-to-end tests
        run: SEC_BIN="$RUNNER_TEMP/sec-bin" tests/e2e.sh
